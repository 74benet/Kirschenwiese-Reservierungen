version: '3.8'

# Lokal mit eigener Datenbank starten: docker-compose up --build  ->  http://localhost:8080
services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      # Im Docker-Netzwerk heißt die Datenbank "db"
      DB_HOST: db
      DB_PORT: 5432
      DB_SSL: "false"

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
